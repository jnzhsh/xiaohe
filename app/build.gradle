plugins { id 'com.android.application' }
def asrDirectory = rootProject.layout.buildDirectory.dir('thirdparty')
def asrAssets = rootProject.layout.buildDirectory.dir('generated/asr-assets')
tasks.register('prepareOfflineSpeech', Exec) {
  workingDir rootProject.projectDir
  commandLine (System.getenv('XIAOHE_PYTHON') ?: 'python'), rootProject.file('prepare-asr.py').absolutePath
  inputs.files(rootProject.file('prepare-asr.py'), rootProject.file('asr-dependencies.json'))
  outputs.dir(asrDirectory)
  outputs.dir(asrAssets)
}
def generatedManifest = layout.buildDirectory.file('generated/gradle-manifest/AndroidManifest.xml')
tasks.register('prepareGradleManifest') {
  inputs.file('src/main/AndroidManifest.xml')
  outputs.file(generatedManifest)
  doLast {
    def destination = generatedManifest.get().asFile
    destination.parentFile.mkdirs()
    destination.text = file('src/main/AndroidManifest.xml').getText('UTF-8').replace(' package="app.xiaohe.assistant"', '')
  }
}
android {
  namespace 'app.xiaohe.assistant'
  compileSdk 35
  defaultConfig { applicationId 'app.xiaohe.assistant'; minSdk 26; targetSdk 35; versionCode 7; versionName '1.4.0' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
  buildTypes { release { minifyEnabled false } }
  sourceSets { main { manifest.srcFile generatedManifest.get().asFile; assets.srcDir asrAssets } }
  packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
  implementation files(asrDirectory.get().file('sherpa-onnx-1.13.8-static.aar')).builtBy('prepareOfflineSpeech')
  implementation files(asrDirectory.get().file('kotlin-stdlib-1.7.20.jar')).builtBy('prepareOfflineSpeech')
}
tasks.named('preBuild').configure { dependsOn('prepareGradleManifest', 'prepareOfflineSpeech') }
